# $SPLUNK_HOME/etc/system/local/deploymentclient.conf içine koy, sonra:
#   $SPLUNK_HOME/bin/splunk restart
# (install-hf-node.sh doldurulmuş halini sonda basar.)
#
# Deployment server: variables.env DS_IP doluysa o, boşsa INDEXER_IP (combo
# server: indexer + deployment server). HF'yi serverclass'lara abone eder;
# hangi app'lerin push edileceğini deployment server'daki serverclass.conf
# belirler.
#
# DİKKAT: HF'lerde targetUri VIP OLAMAZ. IPVS-DR gereği VIP her HF'nin lo
# arayüzünde tanımlı; HF'den VIP:8089'a giden bağlantı LB'ye hiç çıkmaz,
# HF'nin kendisine gider. (LB'deki DS yönlendirmesi -- DS_IP -- HF dışındaki
# UF/istemciler içindir.) Bu yüzden burada DS'nin kendi IP'si kullanılır.

[deployment-client]

[target-broker:deploymentServer]
targetUri = <HF_DEPLOYMENT_SERVER>:<DS_PORT>

# İsteğe bağlı: deployment server'da serverclass'ları host bazlı ayırt etmek
# istersen (örn. hf1'e DB Connect push edip diğerlerine etmemek için) her HF'ye
# farklı bir clientName ver. Boş bırakılırsa Splunk makinenin hostname'ini
# kullanır (HF_NODES'taki adlar zaten yeterli ayrım sağlıyorsa gerek yok).
# clientName = hf1-dbconnect

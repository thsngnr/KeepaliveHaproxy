# $SPLUNK_HOME/etc/system/local/deploymentclient.conf içine koy, sonra:
#   $SPLUNK_HOME/bin/splunk restart
#
# Deployment server: 10.100.100.161 (combo server -- indexer + license_master +
# deployment_server + kv_store). HF'yi serverclass'lara abone eder; hangi
# app'lerin push edileceğini deployment server tarafında serverclass.conf
# belirler, burada değişen bir şey yok.

[deployment-client]

[target-broker:deploymentServer]
targetUri = <INDEXER_IP>:8089

# İsteğe bağlı: deployment server'da serverclass'ları host bazlı ayırt etmek
# istersen (örn. hf1'e DB Connect push edip hf2/hf3'e etmemek için) her HF'ye
# farklı bir clientName ver. Boş bırakılırsa Splunk, makinenin hostname'ini
# kullanır (bu durumda splunk-hf-1 / splunk-hf-2 / splunk-hf-3 zaten yeterli
# ayrım sağlar, clientName'e gerek kalmaz).
# clientName = hf1-dbconnect

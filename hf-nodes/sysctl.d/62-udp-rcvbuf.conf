# UDP syslog alim tamponu (HF). Yuksek EPS'te varsayilan ~208 KB tampon dolar ve
# paketler cekirdekte dusurulur (nstat UdpRcvbufErrors artar). rsyslog imudp
# rcvbufSize'i rmem_max ile SINIRLANIR (4 MB'ta 8 MB'a kirpilir), bu yuzden ikisi de.
net.core.rmem_default = 26214400
net.core.rmem_max = 26214400

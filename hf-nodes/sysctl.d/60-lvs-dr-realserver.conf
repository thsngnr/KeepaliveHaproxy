# LVS-DR real-server ARP suppression, for all 3 hf-* nodes (same file).
# Purpose: VIP <VIP_IP>/32 lives on lo only; these HFs must never answer
# ARP for the VIP on the primary NIC, or they would steal traffic from the
# active director (lb1/lb2).
#
# net.ipv4.conf.default.* only applies to interfaces created AFTER the
# sysctl is loaded -- the primary NIC already existed at boot, so it keeps
# arp_ignore=0/arp_announce=0 even with `default` set to 1/2 unless you add
# explicit per-interface lines too. Replace "eth0" below with your actual
# primary interface name if different.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.lo.arp_ignore = 1
net.ipv4.conf.lo.arp_announce = 2
net.ipv4.conf.eth0.arp_ignore = 1
net.ipv4.conf.eth0.arp_announce = 2
net.ipv4.ip_forward = 0

# Same file for hf1, hf2, hf3.
# Loglar <DATA_DIR>/<kaynak-ip>/ altina yazilir (kaynak IP = %FROMHOST-IP%).
# Syslog IPVS-DR ile geldigi icin HF'ye giden paketin kaynak IP'si gercek
# client IP'sidir -- HAProxy/NAT yok, ek parse/quarantine mantigi gerekmez.
#
# Not (Ubuntu): rsyslog varsayilan olarak syslog kullanicisina privilege-drop
# yapar, bu yuzden eski yapilandirmadaki fileOwner/fileGroup="root" satirlari
# kaldirildi (root olmayan process chown yapamaz). <DATA_DIR> syslog
# kullanicisina ait olmali (install-hf-node.sh bunu yapar). Dosya modu 0644
# oldugu icin Splunk (farkli kullanici olsa da) okuyabilir.

$RuleSet splunk
template (name="splunk_template" type="string" string="<DATA_DIR>/%FROMHOST-IP%/%$MYHOSTNAME%-%$YEAR%-%$MONTH%-%$DAY%-%$HOUR%-%$QHOUR%.log")
template (name="splunk_message_template" type="string" string="%syslogtag%%msg%\n")
action(type="omfile" DirCreateMode="0755" FileCreateMode="0644" dynaFile="splunk_template" dynaFileCacheSize="200" ioBufferSize="64k" template="splunk_message_template")


$Umask 0022
$ModLoad imtcp
$ModLoad imudp
#$InputTCPSupportOctetCountedFraming off
$InputTCPServerBindRuleset splunk
$InputUDPServerBindRuleset splunk
$InputTCPServerRun <SYSLOG_PORT>
$UDPServerRun <SYSLOG_PORT>
$PreserveFQDN on
$MaxMessageSize 64k
$MainMsgQueueSize 100000
$RulesetCreateMainQueue on
$RuleSet RSYSLOG_DefaultRuleset

# Same file for hf1, hf2, hf3.
# Directory key is the real client IP only when it can be proven.
# IPVS senders (fromhost is not an LB) keep %fromhost-ip%.
# Traffic whose fromhost IS one of the LB IPs (should not normally happen --
# syslog never goes through HAProxy in this design -- but kept as a defensive
# fallback) tries to extract an IPv4 from a comma-separated HOSTNAME field;
# anything that doesn't parse as one IPv4 goes to a fixed quarantine file.
# The path is never built from an unvalidated hostname, so a comma or
# ".." inside the client HOSTNAME cannot choose the directory.
# Splunk monitor stays [monitor:///opt/data/...]. Do not change inputs.conf
# except as described in splunk/inputs.conf.snippet.
# _quarantine is under that tree, so invalid lines are still indexed.

module(load="imtcp")
module(load="imudp")

$template PerSourceIPFile,"/opt/data/%$.srcip%/%$YEAR%-%$MONTH%-%$DAY%.log"
$template QuarantineFile,"/opt/data/_quarantine/%$YEAR%-%$MONTH%-%$DAY%.log"

ruleset(name="hfSyslogIngest") {
    set $.srcip = $fromhost-ip;
    set $.quarantine = "0";
    if ($fromhost-ip == "<LB1_IP>" or $fromhost-ip == "<LB2_IP>") then {
        set $.candidate = $hostname;
        if ($hostname contains ",") then {
            set $.candidate = re_extract($hostname, "^(.*),([^,]+)\$", 0, 2, "");
        }
        if (re_match($.candidate, "^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}\$")) then {
            set $.srcip = $.candidate;
        } else {
            set $.quarantine = "1";
        }
    }
    if ($.quarantine == "0") then {
        action(type="omfile" dynaFile="PerSourceIPFile" createDirs="on"
               dirCreateMode="0750" fileCreateMode="0640"
               dirOwner="syslog" dirGroup="adm" fileOwner="syslog" fileGroup="adm")
    } else {
        action(type="omfile" dynaFile="QuarantineFile" createDirs="on"
               dirCreateMode="0750" fileCreateMode="0640"
               dirOwner="syslog" dirGroup="adm" fileOwner="syslog" fileGroup="adm")
    }
}

input(type="imtcp" port="<SYSLOG_PORT>" ruleset="hfSyslogIngest")
input(type="imudp" port="<SYSLOG_PORT>" ruleset="hfSyslogIngest")

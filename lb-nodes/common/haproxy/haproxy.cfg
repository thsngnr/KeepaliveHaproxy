# HEC (<HEC_PORT>) load balancing only.
# Syslog 514/tcp+udp is NOT relayed through HAProxy (Keepalived+IPVS-DR owns it)
# so the real client source IP is preserved end to end. Same file for lb1 and lb2.
# HEC mode depends on HEC_SSL (install-lb-node.sh keeps one of the #HECHTTP# /
# #HECTLS# line sets and deletes the other):
#   HEC_SSL=0 -> mode http, per-request balancing, sticky on HEC channel
#   HEC_SSL=1 -> mode tcp TLS passthrough, balance <HEC_TLS_BALANCE>

global
    log /dev/log local0
    maxconn 20000
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 3

frontend hec_in
    bind *:<HEC_PORT>
#HECHTTP#     mode http
#HECHTTP#     option httplog
#HECHTTP#     timeout http-request 10s
#HECHTTP#     timeout http-keep-alive 10s
#HECTLS#     mode tcp
    default_backend hec_hfs

backend hec_hfs
    # Indexer acknowledgment (useACK): the ack poll for a channel must reach
    # the same HF that received that channel's events, or Splunk answers
    # "unknown channel". Plain roundrobin breaks this.
    #
    # HTTP: every request is balanced individually (keep-alive clients no
    # longer pin to one HF) and hashed on X-Splunk-Request-Channel; requests
    # without a channel fall back to roundrobin. A channel passed as the
    # ?channel= query param is copied into the header so it hashes the same.
    # hash-type consistent: an HF going down only remaps its own channels.
#HECHTTP#     mode http
#HECHTTP#     http-request set-header X-Splunk-Request-Channel %[url_param(channel)] if !{ req.hdr(X-Splunk-Request-Channel) -m found } { url_param(channel) -m found }
#HECHTTP#     balance hdr(X-Splunk-Request-Channel)
#HECHTTP#     hash-type consistent
    #
    # TLS passthrough: headers are not visible, so stickiness is by client IP
    # (HEC_TLS_BALANCE=source, default). roundrobin is only safe without useACK.
#HECTLS#     mode tcp
#HECTLS#     balance <HEC_TLS_BALANCE>
#HECTLS#     hash-type consistent
    # HEC pool health tracks its own readyz signal (splunkd 8089 + HEC),
    # independent of syslog health.
    option httpchk GET /readyz/hec
    http-check expect status 200
    # One server line per HF in HF_NODES (variables.env), generated at render.
    #HF_BEGIN#
    server <HF_NAME> <HF_IP>:<HEC_PORT> check port <READYZ_PORT> inter 3s fall 3 rise 2
    #HF_END#

# Local-only stats socket for health/ops visibility, not exposed off-box.
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s


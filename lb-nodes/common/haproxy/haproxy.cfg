# HEC (TCP/<HEC_PORT>) load balancing only.
# Syslog 514/tcp+udp is NOT relayed through HAProxy (Keepalived+IPVS-DR owns it)
# so the real client source IP is preserved end to end. Same file for lb1 and lb2.
# No TLS: HEC input has enableSSL=0 on the HFs.

global
    log /dev/log local0
    maxconn 20000
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 3

frontend hec_in
    bind *:<HEC_PORT>
    mode tcp
    default_backend hec_hfs

backend hec_hfs
    mode tcp
    balance roundrobin
    # HEC pool health tracks its own readyz signal (splunkd 8089 + HEC),
    # independent of syslog health.
    option httpchk GET /readyz/hec
    http-check expect status 200
    server <HF1_NAME> <HF1_IP>:<HEC_PORT> check port <READYZ_PORT> inter 3s fall 3 rise 2
    server <HF2_NAME> <HF2_IP>:<HEC_PORT> check port <READYZ_PORT> inter 3s fall 3 rise 2
    server <HF3_NAME> <HF3_IP>:<HEC_PORT> check port <READYZ_PORT> inter 3s fall 3 rise 2

# Local-only stats socket for health/ops visibility, not exposed off-box.
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s

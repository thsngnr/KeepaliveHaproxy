# IPVS, bir real_server (HF) kernelden silindiginde (health-check dustugunde)
# o real_server'a ZATEN baglanmis mevcut akislari (ozellikle UDP, connection
# template uzerinden dakikalarca kalici kalabilir) otomatik temizlemiyor --
# sadece YENI akislar saglikli host'lara gidiyor. Bu iki sysctl olmadan, bir
# HF dustugunde o anda ona baglanmis olan UDP gonderenlerin logu
# connection-template timeout'una kadar (varsayilan dakikalar) surekli
# kaybolur, keepalived'in health-check'i dogru calissa bile.
#
# 2026-10-02 failover testinde dogrulandi: bu olmadan etkilenen akislarin
# teslimati %100 kayba kadar dusup hic duzelmiyordu; bununla health-check
# tespit penceresinden (~3-9s) sonra otomatik saglikli HF'ye yeniden
# baglaniyor. Detaylar icin README'deki "Failover testleri" bolumune bak.
net.ipv4.vs.expire_nodest_conn = 1
net.ipv4.vs.expire_quiescent_template = 1

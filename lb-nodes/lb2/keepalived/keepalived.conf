# lb2 (<LB2_IP>). VIP + IPVS-DR for syslog TCP/UDP <SYSLOG_PORT>.
# HEC (<HEC_PORT>) stays on HAProxy only. VRRP auth_hmac enforced, key in
# /etc/keepalived/keys/vrrp200 (same key file as lb1 -- copy, do not
# regenerate per node).
#
# chk_haproxy deliberately does NOT track syslog/IPVS real-server health:
# losing all 3 HF backends must not trigger a VIP/VRRP failover between
# lb1/lb2 -- that is an alerting condition, not a failover trigger.
#
# DR mode requires lb1/lb2/hf1/hf2/hf3 all on the same L2 segment (same
# subnet, no router between the LB pair and the real servers).

global_defs {
    router_id <LB2_ROUTER_ID>
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    weight 0
    fall 2
    rise 2
}

vrrp_instance VI_200 {
    state BACKUP
    interface <VRRP_INTERFACE>
    virtual_router_id <VRRP_VIRTUAL_ROUTER_ID>
    priority 100
    nopreempt
    advert_int 1

    unicast_src_ip <LB2_IP>
    unicast_peer {
        <LB1_IP>
    }

    auth_hmac {
        key 1 file:/etc/keepalived/keys/vrrp200
        active_key 1
        anti_replay time
        time_window 5
        mode enforce
    }

    #VMAC# use_vmac vrrp200
    #VMAC# vmac_xmit_base

    virtual_ipaddress {
        <VIP_IP>/<VIP_PREFIX>
    }

    track_script {
        chk_haproxy
    }
}

# --- IPVS Direct Routing pools: Syslog TCP/<SYSLOG_PORT> and UDP/<SYSLOG_PORT> ---
# Identical to lb1's virtual_server blocks -- keepalived installs IPVS rules
# on both nodes at all times; only the current VIP owner actually receives
# traffic (ARP for the VIP only answers from the master).

virtual_server <VIP_IP> <SYSLOG_PORT> {
    delay_loop 3
    lb_algo wlc
    lb_kind DR
    protocol TCP

    real_server <HF1_IP> <SYSLOG_PORT> {
        weight 1
        TCP_CHECK { connect_port <SYSLOG_PORT>  connect_timeout 3 }
        MISC_CHECK {
            misc_path "/etc/keepalived/check_hf_ready.sh <HF1_IP> tcp"
            misc_timeout 3
            retry 2
            delay_before_retry 3
        }
    }
    real_server <HF2_IP> <SYSLOG_PORT> {
        weight 1
        TCP_CHECK { connect_port <SYSLOG_PORT>  connect_timeout 3 }
        MISC_CHECK {
            misc_path "/etc/keepalived/check_hf_ready.sh <HF2_IP> tcp"
            misc_timeout 3
            retry 2
            delay_before_retry 3
        }
    }
    real_server <HF3_IP> <SYSLOG_PORT> {
        weight 1
        TCP_CHECK { connect_port <SYSLOG_PORT>  connect_timeout 3 }
        MISC_CHECK {
            misc_path "/etc/keepalived/check_hf_ready.sh <HF3_IP> tcp"
            misc_timeout 3
            retry 2
            delay_before_retry 3
        }
    }
}

virtual_server <VIP_IP> <SYSLOG_PORT> {
    delay_loop 3
    lb_algo wrr
    lb_kind DR
    protocol UDP

    real_server <HF1_IP> <SYSLOG_PORT> {
        weight 1
        MISC_CHECK {
            misc_path "/etc/keepalived/check_hf_ready.sh <HF1_IP> udp"
            misc_timeout 3
            retry 2
            delay_before_retry 3
        }
    }
    real_server <HF2_IP> <SYSLOG_PORT> {
        weight 1
        MISC_CHECK {
            misc_path "/etc/keepalived/check_hf_ready.sh <HF2_IP> udp"
            misc_timeout 3
            retry 2
            delay_before_retry 3
        }
    }
    real_server <HF3_IP> <SYSLOG_PORT> {
        weight 1
        MISC_CHECK {
            misc_path "/etc/keepalived/check_hf_ready.sh <HF3_IP> udp"
            misc_timeout 3
            retry 2
            delay_before_retry 3
        }
    }
}

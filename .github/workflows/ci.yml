name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # shellcheck, Python 3.6 soz dizimi, sablon render (yer tutucu kontrolu),
      # haproxy -c, keepalived -t, rsyslogd -N1 (8.2312 + 8.24), lb-status testi.
      # Yerelde ayni komut: ./scripts/ci-check.sh
      - run: ./scripts/ci-check.sh
